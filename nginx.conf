# Configuração Nginx para compressão de texto
# Adicione estas diretivas no bloco http do seu nginx.conf

# Habilitar compressão GZIP
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/xhtml+xml application/x-font-ttf application/vnd.ms-fontobject font/opentype image/svg+xml image/x-icon;
gzip_min_length 1000;
gzip_disable "msie6";

# Habilitar compressão Brotli (se o módulo estiver instalado)
# brotli on;
# brotli_comp_level 6;
# brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/xhtml+xml application/x-font-ttf application/vnd.ms-fontobject font/opentype image/svg+xml image/x-icon;

# Cache de arquivos estáticos
location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Headers de segurança
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;

